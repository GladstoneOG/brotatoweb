name = "brotatoweb"
main = "cloudflare_worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "RELAY_HUB"
class_name = "BrotatoRelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrotatoRelayHub"]

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "BrotatoRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BrotatoRoom"]
